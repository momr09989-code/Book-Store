<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Book Fair & Literature</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <header class="top-bar">
    <div class="container header-content">
      <h1>Book Fair & Literature</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="favorites.html">Favorites</a>
        <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="login.html">Account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2>Contact Us</h2>
      <form id="contactForm" class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Write your message" required></textarea>

        <button type="submit" class="btn">Send</button>
        <p id="formMessage" class="small-text" style="margin-top: 10px;"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Developed by Omar & Ammar | Book Fair & Literature</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
