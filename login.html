<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Book Fair & Literature</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body data-page="login">
  <header class="top-bar">
    <div class="container header-content">
      <h1>Book Fair & Literature</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="favorites.html">Favorites</a>
        <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" class="active">Account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section login-form-container">
      <h2>Account Login</h2>
      <form id="loginForm" class="contact-form" action="index.html">
        <div class="form-group">
          <label for="username">Email or Username</label>
          <input type="text" id="username" placeholder="Enter your email or username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="buttons" style="margin-top: 15px;">
          <button type="submit" class="btn">Login</button>
        </div>
        <p id="loginMessage" class="small-text" style="margin-top: 12px;"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Developed by Omar & Ammar | Book Fair & Literature</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
